<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="map"></div>
  </div>
  <div class="dock dock-right" id="dock-results">
    <div class="sheet">
      <section class="card" id="results" aria-live="polite">
        <div id="skeleton" class="skeleton">
          <div class="sh circle"></div>
          <div class="sh line"></div>
          <div class="sh line short"></div>
        </div>
        <div id="result" hidden>
          <div class="ring" id="ring"><span id="score">0</span></div>
          <div class="horizons">
            <article class="horizon"><h2>In 5 min</h2><p><span id="h5">–</span> <span id="a5"></span></p></article>
            <article class="horizon"><h2>In 10 min</h2><p><span id="h10">–</span> <span id="a10"></span></p></article>
          </div>
          <div id="pills" class="pills"></div>
          <p id="summary" class="soft"></p>
          <ul id="tips"></ul>
        </div>
        <p id="error" class="error" hidden></p>
        <button type="button" id="refresh" class="chip on">Refresh</button>
      </section>
    </div>
    <button type="button" class="tab" id="tab-results" aria-expanded="true" aria-label="Collapse"></button>
  </div>
  <div class="dock dock-left" id="dock-form">
    <button type="button" class="tab" id="tab-form" aria-expanded="true" aria-label="Collapse"></button>
    <div class="sheet">
      <header>
        <h1>Sentinel</h1>
        <p>Tell us where you are. We'll check how safe it looks.</p>
      </header>
      <form class="card" id="form">
        <fieldset>
          <legend>City</legend>
          <div id="cities" class="chips"></div>
        </fieldset>
        <button type="button" id="locate" class="chip">Use my location</button>
        <fieldset>
          <legend>When</legend>
          <div id="when" class="chips"></div>
        </fieldset>
        <fieldset>
          <legend>What you're doing</legend>
          <div id="activity" class="chips"></div>
        </fieldset>
        <fieldset>
          <legend>Phone signal</legend>
          <div id="signal" class="chips"></div>
        </fieldset>
        <button type="button" id="net" class="chip on" aria-pressed="true">Internet on</button>
        <label class="battery" for="battery">Battery <output id="batteryOut">80</output></label>
        <input id="battery" type="range" min="1" max="100" value="80">
        <fieldset>
          <legend>People around you</legend>
          <div id="people" class="chips"></div>
        </fieldset>
      </form>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
