[project]
name = "threat-engine"
version = "0.1.0"
description = "Module 1 AI threat assessment engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0,<3",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "cachetools>=5.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.4.0",
    "shap>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "threat_engine"

[tool.setuptools.packages.find]
where = ["threat_engine"]

[tool.setuptools.package-data]
app = ["data/*.csv", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["threat_engine"]
testpaths = ["threat_engine/tests"]
asyncio_mode = "auto"
